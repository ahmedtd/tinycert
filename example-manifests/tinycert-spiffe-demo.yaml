# This namespace contains a demo client/server pair that use certificates issued
# by ahmedtd.github.io/tinycert-spiffe.

apiVersion: v1
kind: Namespace
metadata:
  name: tinycert-spiffe-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: tinycert-spiffe-demo
  labels:
    app: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
      - name: server
        image: ko://github.com/ahmedtd/tinycert/cmd/tinycerttool
        command:
        - /ko-app/tinycerttool
        - demo-server
        - --listen=0.0.0.0:443
        - --spiffe-credential-folder=/run/tinycert-spiffe
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tinycert-spiffe-credential-folder
          mountPath: /run/tinycert-spiffe
      volumes:
      - name: tinycert-spiffe-credential-folder
        projected:
          sources:
          - podCertificate:
              signerName: ahmedtd.github.io/tinycert-spiffe
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.private-key.pem
          - clusterTrustBundle:
              signerName: ahmedtd.github.io/tinycert-spiffe
              labelSelector:
                matchLabels:
                  "ahmedtd.github.io/tinycert-canarying": "live"
                  "ahmedtd.github.io/tinycert-workload-trust-domain": "cluster.local"
                  "ahmedtd.github.io/tinycert-peer-trust-domain": "cluster.local"
              path: cluster.local.spiffe-trust-bundle.pem
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: tinycert-spiffe-demo
spec:
  type: ClusterIP
  ports:
    - name: https
      port: 443
  selector: {
    app: server,
  }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: tinycert-spiffe-demo
  labels:
    app: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      restartPolicy: Always
      containers:
      - name: client
        image: ko://github.com/ahmedtd/tinycert/cmd/tinycerttool
        command:
        - /ko-app/tinycerttool
        - https-client
        - --fetch-url=https://server.tinycert-spiffe-demo.svc/spiffe-echo
        - --spiffe-credential-folder=/run/tinycert-spiffe
        - --server-spiffe-id=spiffe://cluster.local/ns/tinycert-spiffe-demo/sa/default
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tinycert-spiffe-credential-folder
          mountPath: /run/tinycert-spiffe
      volumes:
      - name: tinycert-spiffe-credential-folder
        projected:
          sources:
          - podCertificate:
              signerName: ahmedtd.github.io/tinycert-spiffe
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.private-key.pem
          - clusterTrustBundle:
              signerName: ahmedtd.github.io/tinycert-spiffe
              labelSelector:
                matchLabels:
                  "ahmedtd.github.io/tinycert-canarying": "live"
                  "ahmedtd.github.io/tinycert-workload-trust-domain": "cluster.local"
                  "ahmedtd.github.io/tinycert-peer-trust-domain": "cluster.local"
              path: cluster.local.spiffe-trust-bundle.pem