apiVersion: v1
kind: Namespace
metadata:
  name: tinycert-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tinycert-signer
rules:
# The service signer needs to be able to read services and pods.
- apiGroups:
  - ""
  resources:
  - services
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - certificates.k8s.io
  resources:
  - podcertificaterequests
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - certificates.k8s.io
  resources:
  - clustertrustbundles
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - delete
- apiGroups:
  - certificates.k8s.io
  resources:
  - podcertificaterequests/status
  verbs:
  - update
- apiGroups:
  - certificates.k8s.io
  resources:
  - signers
  resourceNames:
  - ahmedtd.github.io/tinycert-spiffe
  - ahmedtd.github.io/tinycert-service
  verbs:
  - sign
  - attest
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tinycert-is-a-tinycert-signer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tinycert-signer
subjects:
- kind: ServiceAccount
  namespace: tinycert-system
  name: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: tinycert-system
  name: tinycert-controller
rules:
- apiGroups:
  - "coordination.k8s.io"
  resources:
  - "leases"
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tinycert-is-a-tinycert-controller
  namespace: tinycert-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tinycert-controller
subjects:
- kind: ServiceAccount
  namespace: tinycert-system
  name: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tinycert-controller
  namespace: tinycert-system
  labels:
    app: tinycert-controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tinycert-controller
  template:
    metadata:
      labels:
        app: tinycert-controller
    spec:
      containers:
      - name: controller
        image: ko://github.com/ahmedtd/tinycert/cmd/tinycerttool
        command:
        - /ko-app/tinycerttool
        - controller
        - --in-cluster=true
        - --sharding-pod-namespace=$(POD_NAMESPACE)
        - --sharding-pod-name=$(POD_NAME)
        - --sharding-pod-uid=$(POD_UID)
        - --sharding-application-name=mesh-controller
        - --enable-service-dns-signer=true
        - --service-dns-ca-pool=/run/ca-state/service-dns-pool.json
        - --enable-spiffe-signer=true
        - --spiffe-trust-domain=cluster.local
        - --spiffe-ca-pool=/run/ca-state/spiffe-pool.json
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        volumeMounts: [
          {
            name: "ca-state",
            mountPath: "/run/ca-state",
          }
        ]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          readOnlyRootFilesystem: true
      volumes:
      - name: "ca-state"
        projected:
          sources:
          - secret:
              name: "service-dns-ca-pool"
              items: 
              - key: "pool"
                path: "service-dns-pool.json"
          - secret:
              name: "spiffe-ca-pool"
              items:
              - key: "pool"
                path: "spiffe-pool.json"
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/os: linux
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
